version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: carlos_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-mypasswordsec}
      MYSQL_DATABASE: carlos_rosa_db
      MYSQL_USER: carlos_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-mypasswordsec}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - carlos_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: carlos_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=carlos_rosa_db
      - DB_USER=carlos_user
      - DB_PASSWORD=${DB_PASSWORD:-mypasswordsec}
      - JWT_SECRET=${JWT_SECRET:-INJECT_SECRET_IN_DOTENV_DO_NOT_HARDCODE}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    ports:
      - "8080:8080"
    networks:
      - carlos_network

  frontend:
    image: nginx:alpine
    container_name: carlos_nginx
    restart: always
    volumes:
      - ./frontend/public:/usr/share/nginx/html/public
      - ./frontend/admin:/usr/share/nginx/html/admin
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - carlos_network

volumes:
  db_data:

networks:
  carlos_network:
    driver: bridge
